name: Auto Update Latest Sermon

on:
  schedule:
    # Runs every Monday at 12:00 UTC (8:00 AM Chile time, GMT-4)
    - cron: '0 12 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-sermon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Update Script
        run: node scripts/update-sermon.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes in latest sermon."
          else
            git commit -m "chore: auto-update latest sermon [skip ci]"
            git push
          fi
